name: Check

# The refactoring safety net: Lint, unit tests, screenshot verification, detekt and ktfmt.
# It skips the Go build (IS_COPILOT=true), so it runs in a few minutes.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gate
    runs-on: ubuntu-latest
    env:
      IS_COPILOT: "true"
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle and Robolectric
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-check-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-check-

      - name: Run the gate
        run: ./gradlew --no-daemon :app:check :app:verifyRoborazziDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports
          path: |
            app/build/reports/
            app/src/test/screenshots/**/*_actual.png
            app/src/test/screenshots/**/*_compare.png
          if-no-files-found: ignore
